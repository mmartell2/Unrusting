<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advise Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <h1 class="advice-h1">Advise Generator</h1>

        </button>
    </div>
</body>
<script src="script.js"></script>
</html>
